<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Commander</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="screen hidden">
  <div class="login-box">
    <div class="logo">AREA COMMANDER</div>
    <div class="sub">地區指揮系統 · 終端登入</div>
    <label>呼號（暱稱）<input id="lg-name" maxlength="16" autocomplete="username"></label>
    <label>通行碼<input id="lg-pw" type="password" autocomplete="current-password"></label>
    <div class="row">
      <button id="lg-login" class="primary">登入</button>
      <button id="lg-register">註冊</button>
    </div>
    <div id="lg-msg" class="msg"></div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="login-box wide">
    <div class="logo">AREA COMMANDER</div>
    <div class="sub">報到處</div>
    <p>你透過無線電指揮機器人小隊。小隊長有自己的個性與判斷，不一定照字面執行；
      戰場資訊來自小隊回報與數據鏈，敵情可能過時或錯誤。</p>
    <div class="row">
      <button id="lb-enlist" class="primary">🎖 就任指揮官</button>
      <button id="lb-spectate">👁 觀戰</button>
      <button id="lb-help">說明</button>
      <button id="lb-logout">登出</button>
    </div>
    <div id="lb-commanders"></div>
    <div id="lb-msg" class="msg"></div>
  </div>
</div>

<div id="hq" class="screen hidden">
  <header>
    <div class="brand">AREA COMMANDER</div>
    <div id="hd-info"></div>
    <div class="spacer"></div>
    <div id="hd-watch" class="hidden"><select id="watch-sel"></select></div>
    <button id="hd-gm" class="hidden">GM</button>
    <button id="hd-op" class="hidden" title="開啟作戰圖（5×5 格）">🗺 作戰圖</button>
    <button id="hd-replays">回放</button>
    <button id="hd-help">說明</button>
    <button id="hd-logout">登出</button>
    <span id="conn" class="dot"></span>
  </header>
  <main>
    <section id="left">
      <div class="panel hidden" id="tac-dock"></div>
      <div class="panel" id="op-panel">
        <div class="panel-title">作戰圖 <span class="hint" id="op-hint"></span></div>
        <canvas id="opmap" width="520" height="520"></canvas>
        <div id="op-legend" class="legend">
          <span><i class="lg own"></i>我方</span><span><i class="lg ally"></i>友軍</span>
          <span><i class="lg foe"></i>敵情</span><span><i class="lg sus"></i>疑似</span>
          <span>★任務</span><span>↓空投</span><span>⚔交戰中</span>
        </div>
        <div id="cell-info" class="cell-info"></div>
      </div>
    </section>
    <section id="center">
      <div id="squads"></div>
    </section>
    <section id="right">
      <div class="panel" id="sum-panel">
        <div class="panel-title">即時戰況</div>
        <div id="summary"></div>
        <div class="panel-title small">事件</div>
        <div id="events" class="scroll small"></div>
      </div>
      <div class="panel" id="adj-panel">
        <div class="panel-title">副官 <button id="adj-refresh" class="tiny">更新</button></div>
        <div id="adj-summary" class="small"></div>
        <div id="adj-sugs"></div>
      </div>
      <details class="panel" id="mis-panel" open>
        <summary class="panel-title">任務</summary>
        <div id="missions"></div>
      </details>
    </section>
  </main>
</div>

<div id="tac" class="overlay hidden">
  <div class="tac-box" id="tac-box">
    <div class="tac-head">
      <span id="tac-title"></span>
      <span class="spacer"></span>
      <span id="tac-tools"></span>
      <button id="tac-close">✕</button>
    </div>
    <div class="tac-body">
      <div class="tac-canvas">
        <canvas id="tacmap" width="700" height="700"></canvas>
        <canvas id="minimap" width="120" height="120" class="hidden" title="作戰圖（點一下開啟）"></canvas>
      </div>
      <div class="tac-side">
        <div class="panel-title small">戰鬥紀錄</div>
        <div id="tac-log" class="scroll small"></div>
        <div id="tac-replay" class="hidden">
          <div class="row">
            <button id="rp-prev">⏮</button><button id="rp-play">▶</button><button id="rp-next">⏭</button>
            <select id="rp-speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
          </div>
          <input id="rp-seek" type="range" min="0" value="0">
          <div id="rp-pos" class="small"></div>
        </div>
        <div id="tac-unit" class="small"></div>
        <details class="tac-legend small" id="tac-legend" open>
          <summary class="dim">圖例</summary>
          <div><i class="lg own"></i>我方 <i class="lg ally"></i>友軍 <i class="lg foe"></i>敵人（看得到）</div>
          <div><i class="lg ghost"></i>敵人最後位置（越淡越舊）　<span class="amber">?</span> 聽到槍聲的大概位置</div>
          <div><span style="color:#5adce8">┄</span> 警戒射擊（移動中挨打）　<span class="amber">─</span> 壓制射擊　<span class="red">─</span> 看不到的射手／命中</div>
          <div># 牆　W 窗　= 矮牆　% 瓦礫　" 植被</div>
        </details>
      </div>
    </div>
  </div>
</div>

<div id="op-pop" class="overlay hidden">
  <div class="op-box">
    <div class="row right"><button id="op-close">✕</button></div>
    <div id="op-slot"></div>
  </div>
</div>

<div id="modal" class="overlay hidden"><div class="modal-box"><div id="modal-body"></div>
  <div class="row right"><button id="modal-close">關閉</button></div></div></div>

<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/world.js"></script>
<script src="/static/events.js"></script>
<script src="/static/dock.js"></script>
</body>
</html>
